server:
  port: 8080
spring:
  mvc:
    servlet:
      path: /api
  application:
    name: SSHProxy-project
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/sshproxy-project?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: your_db_username
    password: your_db_password

mybatis-plus:
  type-aliases-package: com.zhanghan.sshproxyproject.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

ssh:
  public-key-path: C:\Users\HP\.ssh\id_rsa
  timeout: 20000

# ==================== AI 服务配置（可选，缺失时静态规则仍兜底） ====================
# 命令审查 → 千问 Qwen（DashScope 兼容模式）
qwen:
  api-key: <your-qwen-api-key>
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen3.7-flash
  timeout: 5000
  daily-token-limit: 20000    # 每日千问 token 额度上限，超限后命令审查降级放行

# 每日策略建议 → DeepSeek
deepseek:
  api-key: <your-deepseek-api-key>
  base-url: https://api.deepseek.com
  model: deepseek-v4-flash
  timeout: 5000
